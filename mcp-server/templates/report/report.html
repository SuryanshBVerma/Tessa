<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' file: data:; style-src 'nonce-{{NONCE}}'; script-src 'nonce-{{NONCE}}'; connect-src 'self'; form-action 'none'; base-uri 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>{{TITLE}}</title>
    <style nonce="{{NONCE}}">
      {{STYLE}}
    </style>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <p class="eyebrow">Tessa test report</p>
        <h1 id="story-title"></h1>
        <p class="run-meta" id="run-meta"></p>
        <p class="run-models" id="run-models" hidden></p>
        <div class="stats" id="stats" role="list" aria-label="Summary"></div>
      </header>

      <nav class="toolbar" aria-label="Filters">
        <div class="segmented" id="status-filter" role="group" aria-label="Filter by status"></div>
        <div class="toolbar-right">
          <label class="select-label" id="persona-wrap">
            <span class="visually-hidden">Persona</span>
            <select id="filter-persona"></select>
          </label>
          <button type="button" class="link-button" id="select-passing">Select passing</button>
          <button type="button" class="link-button" id="select-none" hidden>Clear</button>
        </div>
      </nav>

      <main class="list" id="cards" aria-label="Tests"></main>
      <p class="empty" id="empty" hidden>No tests match these filters.</p>
    </div>

    <footer class="footer" aria-label="Selection">
      <div class="footer-inner">
        <span class="footer-count" id="selected-count">No tests selected</span>
        <span class="footer-target" id="export-target"></span>
        <button type="button" class="button-primary" id="export" disabled>Export</button>
      </div>
    </footer>

    <dialog class="lightbox" id="lightbox" aria-label="Screenshot">
      <img id="lightbox-image" alt="" />
      <p class="lightbox-caption" id="lightbox-caption"></p>
      <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">×</button>
    </dialog>

    <dialog class="modal" id="dialog" aria-labelledby="dialog-title">
      <h2 id="dialog-title"></h2>
      <p id="dialog-body"></p>
      <textarea id="dialog-text" rows="8" readonly hidden></textarea>
      <div class="modal-actions">
        <button type="button" class="button" id="dialog-copy" hidden>Copy</button>
        <button type="button" class="button-primary" id="dialog-close">Done</button>
      </div>
    </dialog>

    <script type="application/json" id="tessa-data">
      {{DATA}}
    </script>
    <script nonce="{{NONCE}}">
      {{SCRIPT}}
    </script>
  </body>
</html>
