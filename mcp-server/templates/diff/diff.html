<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'nonce-{{NONCE}}'; form-action 'none'; base-uri 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>{{TITLE}}</title>
    <style nonce="{{NONCE}}">
      {{STYLE}}
    </style>
  </head>
  <body>
    <div class="page">
      {{BODY}}
    </div>
  </body>
</html>
